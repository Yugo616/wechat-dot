name: Build installers
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        default: all
        options: [all, win]
        description: Build all installers or check Windows only
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platform == 'win' && '[{"os":"windows-latest","platform":"win","arch":"x64"}]' || '[{"os":"macos-15","platform":"mac","arch":"arm64"},{"os":"macos-15-intel","platform":"mac","arch":"x64"},{"os":"windows-latest","platform":"win","arch":"x64"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm run check
      - run: npm run smoke
      - run: node tests/backlog-ui.mjs
      - run: node tests/desktop.mjs
        if: inputs.platform != 'win'
        timeout-minutes: 3
      - name: Build native application
        run: npm run build:native
      - name: Check native backend and lifecycle
        shell: bash
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          node tests/native-backend.mjs
          node tests/native-updater.mjs
      - name: Test bundled Node and dedicated browser
        run: node tests/native-browser.mjs
      - name: Package native installer
        run: node scripts/native-package.mjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check native application installs its own updates
        timeout-minutes: 5
        run: node tests/native-install.mjs
      - name: Prepare previous release for upgrade check
        id: legacy
        run: node tests/legacy-app.mjs
        env:
          WECHAT_DOT_LEGACY_VERSION: '1.1.0'
      - name: Check previous release upgrades to native application
        run: node tests/updater.mjs
        env:
          WECHAT_DOT_UPDATE_NATIVE: '1'
          WECHAT_DOT_EXECUTABLE: ${{ runner.os == 'macOS' && '.cache/legacy/WeChat Dot.app/Contents/MacOS/WeChat Dot' || '.cache/legacy/WeChat Dot.exe' }}
          WECHAT_DOT_LEGACY_INSTALLER: ${{ steps.legacy.outputs.installer }}
      - name: Check Windows installation and native interface
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter '*.exe' | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'wechat-dot-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          $app = Join-Path $target 'WeChat Dot.exe'
          if (!(Test-Path $app)) { throw 'Installed executable missing' }
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force test-results | Out-Null
          foreach ($entry in @(@{ Name = 'app'; Path = $app }, @{ Name = 'installer'; Path = $installer.FullName })) {
            $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($entry.Path)
            if ($null -eq $icon) { throw "Missing $($entry.Name) icon" }
            $bitmap = $icon.ToBitmap()
            $bitmap.Save((Join-Path $PWD "test-results/icon-$($entry.Name).png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $bitmap.Dispose(); $icon.Dispose()
          }
          $env:WECHAT_DOT_EXECUTABLE = $app
          node tests/native-windows-ui.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed native interface failed' }
      - name: Check macOS native application without installed Node
        if: runner.os == 'macOS'
        run: node tests/native-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-installed-interface
          path: test-results/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-dot-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: wechat-dot-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          FLAGS=()
          if [[ "$TAG" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" installers/* --title "WeChat Dot $TAG" --generate-notes "${FLAGS[@]}"
