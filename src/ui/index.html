<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'">
  <title>WeChat Dot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header><div class="brand"><img src="icon.svg" alt="" width="30" height="30"><h1>WeChat Dot</h1></div><span id="version"></span></header>
  <section class="accounts" aria-label="连接账号">
    <div class="account">
      <div class="account-row">
        <div class="account-info"><div class="account-title"><h2>微信</h2><span class="badge" id="weixin-badge">未绑定</span></div><p id="weixin-detail">用手机微信扫码</p></div>
        <button id="weixin-button" data-action="weixin">微信扫码</button>
      </div>
      <div id="qr-area" hidden><img id="qr" alt="微信登录二维码"></div>
      <div id="verify-area" hidden><input id="verify-code" aria-label="配对码" inputmode="numeric" autocomplete="one-time-code" placeholder="手机上的配对码"><button data-action="verify">确认</button></div>
    </div>
    <div class="account">
      <div class="account-row">
        <div class="account-info"><div class="account-title"><h2>ChatGPT dot</h2><span class="badge" id="dot-badge">未绑定</span></div><p id="dot-detail">在浏览器中登录 ChatGPT</p></div>
        <button id="dot-button" data-action="dot">登录 ChatGPT</button>
      </div>
      <div class="account-extra" id="finish-login" hidden><button data-action="finish-login">登录完成，识别 dot</button></div>
      <div class="account-extra" id="extension-area" hidden><button class="link" data-action="extension">安装 Chrome 扩展</button></div>
      <div class="account-extra" id="dot-actions" hidden><button class="link" data-action="show-dot">打开专用窗口</button><button class="link" id="recheck" data-action="discover">重新检查</button></div>
    </div>
  </section>
  <section class="connection-status" aria-live="polite">
    <div class="status-line"><span id="status-dot" aria-hidden="true"></span><strong id="running">转发已暂停</strong></div>
    <p id="detail">先扫码绑定微信，再登录 ChatGPT。</p>
    <button id="recovery-button" data-action="" hidden></button>
  </section>
  <div id="review" hidden>
    <p>请先核对 ChatGPT 中的上一条消息。</p>
    <div class="review-actions"><button data-action="received">已收到，继续</button><button data-action="retry">未收到，重试</button></div>
  </div>
  <button class="primary" id="toggle" data-action="start" disabled>开始转发</button>
  <p class="background-note">开始后自动收起，电脑需保持开机、联网。<br>关闭窗口后仍在菜单栏或托盘运行。</p>
  <footer><button class="link" data-action="check-update" id="update-button">检查更新</button><button class="link" data-action="request-exit" id="exit-button">退出</button></footer>
  <div class="update-note" id="update-area" aria-live="polite" hidden><span id="update-detail"></span><button class="link" data-action="download" id="download">下载页面</button></div>
  <dialog id="exit-dialog" aria-labelledby="exit-title">
    <h2 id="exit-title">要退出 WeChat Dot 吗？</h2>
    <p>最小化后继续在后台转发。退出后台会停止收发。</p>
    <div class="exit-footer"><label><input type="checkbox" id="remember-exit">不再询问</label><div><button data-action="exit-minimize">最小化</button><button data-action="exit-quit">退出后台</button></div></div>
  </dialog>
</main>
<script src="ui.js"></script>
</body>
</html>
